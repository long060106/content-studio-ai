<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Content Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
<link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▶</span>
    <span>Content&nbsp;Studio</span>
  </div>

  <form class="runbar" id="run-form" autocomplete="off">
    <input
      id="url-input"
      type="text"
      placeholder="Paste a YouTube URL or video ID…"
      spellcheck="false"
      aria-label="YouTube URL"
    />
    <button type="submit" id="run-button">Cut clips</button>
  </form>

  <div class="running-chip" id="running-chip" hidden>
    <span class="spinner"></span>
    <button type="button" class="chip-label" id="running-label">Running…</button>
    <button type="button" class="stop-btn" id="stop-button">Stop</button>
  </div>

  <div class="env" id="env-status"></div>
</header>

<div class="shorts-options" id="shorts-options" hidden>
  <label>Moments
    <select id="opt-count">
      <option value="auto" selected>Auto</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
    </select>
  </label>
  <label>Layout
    <select id="opt-style">
      <option value="broll" selected>B-roll behind the voice</option>
      <option value="speaker">Speaker's own footage</option>
      <option value="split">Split — speaker over b-roll</option>
    </select>
  </label>
  <label>Frame
    <select id="opt-frame">
      <option value="square" selected>Square — holds the character</option>
      <option value="wide">Wide — the whole 16:9 width</option>
    </select>
  </label>
  <label>B-roll
    <select id="opt-broll">
      <option value="recommended" selected>Recommended for me</option>
      <option value="both">Mine first, then recommended</option>
      <option value="mine">Only my uploads</option>
    </select>
  </label>
  <label class="upload">Upload b-roll
    <input type="file" id="opt-upload" accept="video/*" multiple hidden />
    <button type="button" id="upload-button">Choose files…</button>
  </label>
  <span class="assets-note" id="broll-note"></span>
  <label class="check"><input type="checkbox" id="opt-carousel" checked /> Quote carousel</label>
  <span class="assets-note" id="assets-note"></span>
</div>

<main class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <span>Library</span>
      <span class="pill" id="lib-count">0</span>
    </div>
    <div id="library" class="library"></div>
  </aside>

  <section class="content" id="content"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/ui/app.js"></script>
</body>
</html>
